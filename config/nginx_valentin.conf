# валентин.вмалмыже.рф → витрина САРАФАНА (живое приложение на локальной
# машине владельца) + визитка владельца (статика, /portfolio/).
#
# Заказ владельца 2026-11-27: «дублировать страницу /regions/links на адрес
# валентин.вмалмыже.рф, создать там страницу такую же и также обновлять там
# информацию, чтобы всегда актуальная была и все работало кнопочки, функции,
# чтобы клиент мог нажать кнопку и создать заказ. Данные будут наполняться отсюда,
# с локального компьютера».
#
# Транспорт: боевой VPS остаётся публичным edge'ом (DNS на него указывает,
# TLS терминируется на edge-прокси Джино), а данные и заявки идут с локальной
# машины владельца. Связь — обратный SSH-туннель, который держит локальная
# машина:
#
#     ssh -N -R 127.0.0.1:18000:127.0.0.1:8000 sarafan
#     (юнит setka-public-tunnel, infra/windows/start-tunnel.ps1)
#
# Порт 18000 на VPS слушает только 127.0.0.1 — наружу он не открыт, и новых
# публичных портов у машины не появляется.
#
# ⚠️ ГЛАВНОЕ ПРАВИЛО ЭТОГО ФАЙЛА: в приложение уходит БЕЛЫЙ СПИСОК путей.
# На локальной машине гейт авторизации выключен (WEB_AUTH_ENABLED=0), и
# приложение отдаёт операторский интерфейс без сессии — дашборд, /tokens,
# /ad, ключи. Если бы сюда попадал catch-all «/», весь САРАФАН уехал бы в
# интернет. Поэтому catch-all здесь — статика визитки, а приложение видит
# ровно четыре пути витрины. Это проверяет тест
# tests/test_infra/test_nginx_config_invariants.py.
#
# Визитка (Next-экспорт проекта ValentinPortfolio) по решению владельца живёт
# под /portfolio/ и по своим прежним адресам (/raboty/, /grabli/ и т.д.) —
# старые ссылки и поиск не ломаются. Её корень отдаёт витрину САРАФАНА.
#
# Установка на VPS:
#   sudo cp config/nginx_valentin.conf /etc/nginx/conf.d/valentin.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Карта доменов — docs/ops/HOSTS.md.

server {
    listen 80;
    server_name xn--80adkmnnb2b.xn--80adkdyec4j.xn--p1ai;

    charset utf-8;
    charset_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Голый http → https (заказ владельца 2026-08-02). Условие и его режим
    # отказа — в config/nginx_maps.conf; здесь тот же приём, что у остальных
    # `*.вмалмыже.рф`: схему знает только заголовок от edge Джино.
    if ($setka_needs_https) {
        return 301 https://$host$request_uri;
    }

    # Приложение отдаёт относительные редиректы — иначе nginx подставит в
    # Location имя сервера в punycode и пользователь увидит «xn--...» в адресе.
    absolute_redirect off;

    client_max_body_size 20m;

    # ── Витрина САРАФАНА: живые данные с локальной машины ────────────────
    #
    # Витрина — ОДНА ИЗ СТРАНИЦ сайта, а не его корень (уточнение владельца
    # 27.11: «мне надо чтобы она была одной из страниц сайта, как портфолио»).
    # Корень домена — визитка владельца, как и была; витрина живёт по пути
    # /sarafan/ (как /raboty/, /grabli/, /zadachi/ у визитки).
    #
    # Заголовки:
    #   Host            — приложение различает хосты по нему;
    #   X-Forwarded-For — реальный IP посетителя ОТ EDGE, передаём как есть.
    #     `$proxy_add_x_forwarded_for` дописал бы адрес edge'а, и гейт/лимиты
    #     взяли бы ПЕРВЫЙ элемент — то есть адрес edge'а: все посетители
    #     склеились бы в одного клиента;
    #   X-Forwarded-Proto — настоящая схема (TLS терминируется на edge).

    # Витрина по своему пути на сайте.
    location = /sarafan/ {
        proxy_pass http://127.0.0.1:18000/regions/links;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $setka_forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Без слэша — на страницу с ним (как и у разделов визитки).
    location = /sarafan {
        return 301 /sarafan/;
    }

    # Та же витрина по её собственному пути в приложении — на случай, если
    # ссылка на /regions/links останется в постах ВК и закладках.
    location = /regions/links {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $setka_forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Данные списка сообществ (живая БД локальной машины).
    location = /api/regions/vk-links {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $setka_forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Приём заявки с витрины (POST). Без этого клиент не может создать заказ.
    location = /api/landing/orders {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $setka_forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Скрипт витрины — единственный внешний файл страницы (CSS встроен).
    location = /static/js/region_links.js {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $setka_forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ── Визитка владельца: статика Next-экспорта ──────────────────────────
    #
    # Визитка — основной сайт на этом домене (решение владельца 27.11), её
    # корень отдаётся по-прежнему. Дополнительно она доступна под
    # /portfolio/ — на случай, если кто-то сохранил такой адрес.
    #
    # Внутренние ссылки у неё абсолютные (/raboty/, /_next/static/...), поэтому
    # страница под /portfolio/ отдаётся как есть, а ссылки ведут на те же
    # разделы по прежним адресам — они и дальше работают (см. catch-all ниже).
    location /portfolio/ {
        alias /home/valstan/valentin/current/;
        index index.html;

        # Те же переписанные ссылки на витрину, что и в основном блоке ниже.
        sub_filter_once off;
        sub_filter 'https://xn--80aaa6cmey.xn--80adkdyec4j.xn--p1ai/regions/links' '/sarafan/';
        sub_filter 'https://xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai/services' '/sarafan/';
    }

    # Ассеты визитки под /portfolio/ — отдельным блоком (вложенный location
    # внутрь alias'а nginx применяет непредсказуемо). Длинный префикс побеждает
    # /portfolio/, поэтому сюда попадают только файлы _next/static.
    location /portfolio/_next/static/ {
        alias /home/valstan/valentin/current/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Статика визитки по прежним адресам: /raboty/, /grabli/, /kontakty/ и т.д.
    # Старые ссылки и поисковые ссылки продолжают работать.
    location / {
        root /home/valstan/valentin/current;
        index index.html;

        try_files $uri $uri/ $uri/index.html =404;

        error_page 404 /404.html;

        # ── Ссылки визитки на витрину САРАФАНА ────────────────────────────
        #
        # В визитке уже есть две ссылки на САРАФАН, и обе — на МЁРТВЫЕ адреса:
        #   * сарафан.вмалмыже.рф/regions/links — из кейса «Сарафан»
        #     (домен сети после переезда отдаёт 503-заглушку);
        #   * вход.вмалмыже.рф/services — «Сервисы Малмыжа ↗» в шапке и подвале
        #     (ЕСА с боксом ушла).
        # Теперь витрина живёт здесь, по пути /sarafan/ — переписываем ссылки
        # на неё, и витрина становится полноценной страницей сайта.
        #
        # Правка живёт в nginx, а не в релизе визитки: релиз принадлежит
        # соседнему проекту, и следующий его деплой затёр бы правку файлов.
        sub_filter_once off;
        sub_filter 'https://xn--80aaa6cmey.xn--80adkdyec4j.xn--p1ai/regions/links' '/sarafan/';
        sub_filter 'https://xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai/services' '/sarafan/';

        # Хэшированные ассеты Next — можно кэшировать навсегда.
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /shots/ {
            expires 30d;
            add_header Cache-Control "public";
        }

        # HTML не кэшируем надолго, иначе новый релиз не виден до истечения кэша.
        location ~* \.(?:html|txt|json|xml)$ {
            add_header Cache-Control "public, max-age=300";
        }
    }

    access_log /home/valstan/valentin/nginx_access.log;
    error_log /home/valstan/valentin/nginx_error.log;
}
