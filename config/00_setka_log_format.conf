# Формат access-лога с $host и схемой — заведён 2026-09-18 под #251.
#
# Зачем: на :443 бокса живёт ровно один server-блок, и наши домены обслуживаются
# его fallback'ом по НЕсовпавшему SNI. Поставить default_server-заглушку, не зная,
# какие Host реально приходят, значит отрезать живой домен. Прежний формат Host
# не писал вовсе — измерить было нечем.
#
# Поведение не меняется: это только запись в лог.
#
# Файл нужен и на боксе, и в репозитории: `setka_host` используют
# setka.conf и setka_http_default.conf, и без этого определения `nginx -t`
# на боксе падает с «unknown log format». В git он отсутствовал — то есть
# сборка бокса из репозитория была бы невозможна. Снят с прода и сверен 01.11.
#
# Установка на прод:
#   sudo cp config/00_setka_log_format.conf /etc/nginx/conf.d/00_setka_log_format.conf
#   sudo nginx -t && sudo systemctl reload nginx

log_format setka_host '$remote_addr - $host [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'proto=$scheme ssl="$ssl_server_name"';
