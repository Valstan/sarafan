# Default-серверы: чужой Host и чужой SNI обрываются, а не доходят до приложения.
#
# Заведено 2026-09-18 под #251 пула («домен без server_name показывает соседа»),
# мандат D-096. До этого default-блок на :80 ПРОКСИРОВАЛ всё в приложение, и по
# логу за 7110 строк туда падали исключительно сканеры: /.env во всех вариантах,
# /.git/HEAD, /key.json, /firebase-adminsdk.json, phpinfo. Каждый такой запрос
# обслуживало наше приложение и отвечало 401 — то есть подтверждало, что здесь
# кто-то живёт, и тратило на это воркер.
#
# Почему это безопасно (измерено 18.09, а не предположено):
#   * наши домены приходят на :80 с правильным Host и совпадают со своими
#     server-блоками (radar_id / sarafan / radar_feed / valentin) — проверено
#     внешними запросами: они легли именно в их access-логи;
#   * TLS наших доменов терминирует edge хостера, до бокса идёт plain HTTP,
#     поэтому :443 бокса живыми доменами не используется вовсе;
#   * единственный TLS-блок (setka.conf) имеет явный server_name и продолжит
#     совпадать по SNI — заглушка ловит только НЕсовпавшее.
#
# 444 — «закрыть соединение без ответа» (нестандартный код nginx, наружу не
# уходит). Для сканера это тишина, а не приглашение.
#
# СВЕРЕНО С ПРОДОМ 2026-11-01: до этой правки в git лежала ДО-#251 версия
# (location / проксировал всё в приложение) — скопировавший её на бокс вернул
# бы сканерам в приложение. Ровно тот разъезд копий, о котором HOSTS.md
# предупреждает. Прод-файл снят и сверен 01.11, эта копия — его точная версия.

server {
    listen 80 default_server;
    server_name _;

    access_log /home/valstan/SETKA/logs/nginx_access_http_default.log setka_host;
    error_log  /home/valstan/SETKA/logs/nginx_error_http_default.log;

    # ACME обязан жить: через webroot продлеваются сертификаты.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 444;
    }
}

server {
    # Чужой SNI: отклоняем рукопожатие, не предъявляя наш сертификат.
    # ssl_reject_handshake доступен с nginx 1.19.4; на боксе 1.28.0.
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
