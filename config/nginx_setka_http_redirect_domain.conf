# Технический домен, порт 80: голый http → https (сертификат боксовый, см.
# nginx_setka.conf). Условие `!= "https"` здесь КОРРЕКТНО именно потому, что
# срабатывает и на пустом заголовке: до этого блока запрос приходит напрямую
# от браузера, без X-Forwarded-Proto от edge. На карту `$setka_needs_https`
# не переводить — она даст 0 и редирект пропадёт (config/nginx_maps.conf).
#
# СНЯТО С ПРОДА 2026-08-02 как есть. Карта доменов — docs/ops/HOSTS.md.
#
# Установка на прод:
#   sudo cp config/nginx_setka_http_redirect_domain.conf \
#     /etc/nginx/conf.d/setka_http_redirect_domain.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 3931b3fe50ab.vps.myjino.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Avoid redirect loops with upstream HTTPS proxy:
    # - if proxy says original scheme was HTTPS, serve over HTTP backend without redirect
    # - otherwise redirect plain HTTP users to HTTPS
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $setka_forwarded_proto;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $setka_forwarded_proto;
    }

    location /static {
        alias /home/valstan/SETKA/web/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Загружаемые файлы — исключение из immutable (D-096 №3, 01.11).
    # Обоснование — в config/nginx_setka.conf (тот же адрес по http).
    location /static/broadcast/ {
        alias /home/valstan/SETKA/web/static/broadcast/;
        expires -1;
    }

    location /static/ad_offers/ {
        alias /home/valstan/SETKA/web/static/ad_offers/;
        expires -1;
    }

    access_log /home/valstan/SETKA/logs/nginx_access_http_domain.log;
    error_log  /home/valstan/SETKA/logs/nginx_error_http_domain.log;
}
