# Технический домен: 3931b3fe50ab.vps.myjino.ru → uvicorn :8000, блок HTTPS.
#
# ⚠️ У ЭТОГО домена своя модель TLS: сертификат живёт НА БОКСЕ (certbot,
# `listen 443 ssl`), а не на edge Джино, как у `*.вмалмыже.рф`. Поэтому здесь
# `X-Forwarded-Proto https` проставляется жёстко, а http→https уводит соседний
# `nginx_setka_http_redirect_domain.conf` по условию `!= "https"` — карту
# `$setka_needs_https` тут применять НЕЛЬЗЯ (она рассчитана на заголовок от
# edge, которого здесь нет; см. config/nginx_maps.conf).
#
# По этому адресу прибиты машинные интеграции: VK-шлюз (gateway_mcp), ingest
# облачной рутины-классификатора, диагностические скрипты. Карта доменов —
# docs/ops/HOSTS.md.
#
# СНЯТО С ПРОДА 2026-08-02 как есть. До этого в git лежала версия годичной
# давности — `listen 80` без TLS и закомментированный редирект: скопировавший
# её на бокс снял бы с техдомена HTTPS. Ровно тот же разъезд копий, который
# 26.07 породил петлю редиректов на радар.вмалмыже.рф.
#
# Установка на прод:
#   sudo cp config/nginx_setka.conf /etc/nginx/conf.d/setka.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name 3931b3fe50ab.vps.myjino.ru;
    client_max_body_size 20m;

    # For Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Discovery — sync endpoint держит запрос до завершения VK groups.search
    # (до 22 ключевиков × geo) + AI-категоризации (до 150 кандидатов через
    # Groq). На больших районах легко уходит за дефолтные 60s → nginx режет
    # 504, фронт получает HTML и падает на JSON.parse. Поднимаем до 180s
    # именно для этого location, не растягивая остальной API.
    location /api/discovery/trigger {
        proxy_pass http://127.0.0.1:8000/api/discovery/trigger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Main application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # Force HTTPS

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static files
    location /static {
        alias /home/valstan/SETKA/web/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Загружаемые файлы — исключение из immutable (D-096 №3, 01.11).
    #
    # Имя файла тут НЕ несёт версию: загрузка идёт под исходным именем
    # (`safe_image_name` → базовое имя, `upload_image` пишет `dest.write_bytes`
    # поверх), поэтому тот же URL спокойно отдаёт новое содержимое. `immutable`
    # на этом адресе — обещание «по адресу навсегда те же байты», и оно ложно:
    # браузер, взявший картинку один раз, держал бы старую до 30 дней. Имя
    # меняется только если оператор переименует файл руками.
    #
    # `expires -1` даёт `Cache-Control: no-cache` — ровно то, что отдаёт второй
    # слой (прямой доступ к приложению в обход nginx, :8000 напрямую):
    # `RevalidatingStaticFiles` (web/static_files.py). Смысл один: копию хранить
    # можно, показывать без перепроверки — нельзя. Перепроверка дешёвая: nginx
    # шлёт ETag и Last-Modified, браузер получает 304, а не файл целиком.
    #
    # Срок жизни 5m вместо этого был бы окном, в котором новая картинка не
    # доезжает: файл меняется вне деплоя (загрузил новую в библиотеку кампаний —
    # и она поехала в VK), а имя осталось прежним.
    location /static/broadcast/ {
        alias /home/valstan/SETKA/web/static/broadcast/;
        expires -1;
    }

    location /static/ad_offers/ {
        alias /home/valstan/SETKA/web/static/ad_offers/;
        expires -1;
    }

    # Health check
    location /api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        access_log off;
    }

    # Logs
    access_log /home/valstan/SETKA/logs/nginx_access.log setka_host;
    error_log /home/valstan/SETKA/logs/nginx_error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/3931b3fe50ab.vps.myjino.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/3931b3fe50ab.vps.myjino.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    # HSTS - временно отключен для диагностики редирект-петли
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
