{% extends "base.html" %}

{% block title %}Клиент - SETKA{% endblock %}
{% block nav_ad %}active{% endblock %}
{% block nav_section_system %}active{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 1100px;">
    <div class="d-flex align-items-center gap-2 mb-3">
        <a href="/ad#clients" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Назад к списку
        </a>
        <h4 class="mb-0" id="client-page-title">
            <i class="bi bi-person"></i> Загрузка...
        </h4>
    </div>
    <div id="client-detail-content">
        <div class="text-center py-4">
            <div class="spinner-border spinner-border-sm text-secondary"></div>
            <p class="mt-2 text-muted mb-0">Загрузка клиента...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="/static/js/ad_crm.js?v={{ STATIC_VERSION }}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const clientId = parseInt('{{ client_id }}');
    if (clientId && typeof loadClientPage === 'function') {
        loadClientPage(clientId);
    }
});
</script>
{% endblock %}
