<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервисы Малмыжа</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('setka-theme') || 'light';
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) { /* localStorage недоступен — остаёмся в light */ }
        })();
    </script>
    <link href="/static/vendor/bootstrap/bootstrap.min.css?v={{ STATIC_VERSION }}" rel="stylesheet">
    <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.css?v={{ STATIC_VERSION }}">
</head>
<body class="d-flex align-items-center" style="min-height: 100vh;">
    <!-- D-065 (владелец 2026-09-02): каталог компактный — три колонки от lg (≥992px),
         две от md, одна на телефоне; карточка = иконка + название + одна строка описания. -->
    <div class="container py-4" style="max-width: 1100px;">
        <div class="text-center mb-4">
            <div style="font-size: 2.5rem; line-height: 1;">🌿</div>
            <h1 class="h4 mb-1">Сервисы Малмыжа</h1>
            <p class="text-secondary mb-0">Все сервисы района — один аккаунт на всех</p>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
            {% for s in services %}
            <div class="col">
                <a class="card text-decoration-none shadow-sm h-100" href="{{ s.url }}">
                    <div class="card-body d-flex align-items-center gap-3 p-3" style="min-width: 0;">
                        <div style="font-size: 1.75rem; line-height: 1;">{{ s.emoji }}</div>
                        <div style="min-width: 0;">
                            <div class="fw-semibold text-truncate" title="{{ s.title }}">{{ s.title }}</div>
                            <div class="text-secondary small text-truncate" title="{{ s.desc }}">{{ s.desc }}</div>
                        </div>
                        <i class="bi bi-chevron-right ms-auto text-secondary"></i>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>

        <p class="text-center text-secondary small mt-4 mb-0">
            Единый вход «Сервисы Малмыжа» — <a class="link-secondary" href="/login">войти</a>
        </p>
        <p class="text-center text-secondary small mt-3 mb-0">
            Сделано программистом <a class="link-secondary" rel="author" href="https://xn--80adkmnnb2b.xn--80adkdyec4j.xn--p1ai/">Валентином Савиных</a>
        </p>
    </div>
</body>
</html>
