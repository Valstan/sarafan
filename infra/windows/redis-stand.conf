# Redis локального стенда Сарафана — конфиг службы Windows.
#
# Заказ владельца 2026-11-27: «сайт должен работать после перезагрузки
# компьютера без входа в систему». Redis — брокер celery и общий кеш, и
# после перезагрузки он обязан подниматься сам. Поэтому он ставится СЛУЖБОЙ
# Windows (auto), а не процессом, запущенным вручную (как было до 27.11).
#
# То же самое требует README локального стенда (infra/windows/README.md):
# «Служба Windows — нужен для PostgreSQL и Redis: им нужен собственный аккаунт
# и автостарт до входа пользователя».
#
# Параметры СОВПАДАЮТ с теми, с которыми Redis работал вручную:
#   port 6379, bind 127.0.0.1, без персистентности (save "" / appendonly no).
# Персистентности нет и раньше: содержимое Redis — очереди, кеши и счётчики,
# которые восстанавливаются, а вот файловое хранилище в репозитории (в
# gitignore) только занимает место и может утащить за собой старый мусор.
#
# Каталог данных (--dir при установке службы) нужен только для файлов
# персистентности — при выключенной он не используется.

port 6379
bind 127.0.0.1
save ""
appendonly no
dir .
