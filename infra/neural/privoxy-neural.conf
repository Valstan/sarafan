# Neural egress: HTTP proxy for the engine in front of the VPN socks inbound.
# The reference setup redirects the engine uid with nft; inside our container the
# nat-output hook never sees the packets (counter stays 0), so the engine gets a
# proxy instead. Loopback only: nothing listens outside 127.0.0.1.

listen-address  127.0.0.1:8118
forward-socks5t / 127.0.0.1:10808 .

# Log proves the engine really left through the tunnel (Request: models.opencode.ai:443/).
logfile /var/log/privoxy/engine.log
logfile-limit 5
debug 1
debug 4096
debug 8192
