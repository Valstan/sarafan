# Конфиг секрет-сканера. Заведён 2026-08-12 после угона Telegram-ботов:
# сканера в контуре не было вовсе (крупнейший незакрытый техдолг по
# docs/PENDING_FOLLOWUPS.md), и утечку токена нашли постфактум глазами.
#
# Дефолтный набор (~195 правил) включён через [extend] и дополнен ТРЕМЯ своими
# правилами ниже. Раньше здесь стоял комментарий, утверждавший, что дефолт
# «включая telegram-bot-api-token, vk-access-token, generic-api-key» нас
# закрывает. Это было неверно в обе стороны, и цена ошибки оказалась
# буквальной — замер 2026-08-20 бинарником 8.21.2:
#
#   * правила `vk-access-token` в дефолтном наборе НЕТ вовсе (ни одного из ~195
#     правил не упоминает VK), а `generic-api-key` ловит `vk1.a.…` только в
#     присвоении — тот же токен в URL или в repr объекта проезжает;
#   * `telegram-bot-api-token` требует тело `A[a-z0-9_-]{34}` — после первой `A`
#     строго СТРОЧНЫЕ. У настоящих токенов Bot API после двоеточия всегда `AA`,
#     то есть правило не ловит НИ ОДИН живой токен. Плюс оно требует рядом слово
#     `telegr` и оператор присваивания, поэтому форма `/bot<ТОКЕН>/sendMessage`
#     (та самая, которой у нас утекло) не ловится ни при каком регистре.
#
# Проверено не рассуждением, а прогоном: корпус из 10 синтетических секретов в
# пяти зонах репозитория дефолт ловил 2/10, с правилами ниже — 10/10. И тем же
# прогоном по истории нашлись 6 настоящих секретов в двух коммитах, о которых
# слепой гейт год рапортовал `no leaks found` (см. .gitleaksignore).
#
# 2026-08-25 (D-036): правила переписаны под приёмочный корпус подсадных
# tests/test_logging/decoys.corpus (35 записей, 26 форм-носителей). Изменения:
# secretGroup + entropy у Telegram-правила, `vk1` -> `vk[12]`, новое правило под
# легаси-форму VK (85 hex). Замер тем же бинарником: 618 коммитов истории —
# `no leaks found`, exit 0; корпус — 26 hit, 2 принятых fp, 0 промахов.

[extend]
useDefault = true

# ─── Свои правила: формы, которыми у нас РЕАЛЬНО утекало ─────────────────────
#
# Регулярки намеренно совпадают с utils/log_redaction.py: маскирование логов и
# секрет-сканер обязаны считать секретом одно и то же. Пока они расходились,
# редактор логов знал про `vk1.a.…` и про токен в пути URL, а гейт — нет.
# Инвариант проверяется тестами tests/test_logging/test_secret_scanner_config.py
# (на фикстурах, питоновым `re`) и tests/test_logging/test_decoy_corpus.py
# (на корпусе подсадных, НАСТОЯЩИМ бинарником — он единственный знает про
# entropy, [[rules.allowlists]] и префильтр keywords).
#
# Дефолтные `telegram-bot-api-token` и `generic-api-key` намеренно НЕ
# переопределяются по id: при [extend] `keywords` дефолтного правила
# ДОПИСЫВАЮТСЯ к нашим, а не заменяются, — переопределив `telegram-bot-api-token`,
# мы бы унаследовали его keyword `telegr` и вместе с ним ту самую слепоту.
# Поэтому — свои id. По той же причине в имени правила не должно быть подстроки
# `generic`: она включает недокументированные режимы дедуп-подавления.
#
# ⛔ ID ПРАВИЛ НЕ ПЕРЕИМЕНОВЫВАТЬ. К ним привязаны 16 отпечатков в
# .gitleaksignore (`<коммит>:<файл>:<правило>:<строка>`), включая намеренно
# подавленный живой VK-токен. Переименование обесточит их все разом, а CI
# сканирует историю целиком — гейт станет красным на каждом PR.

# ─── 1. Telegram Bot API: <bot_id>:<секрет> ──────────────────────────────────
#
# Форма: 6–12 цифр, двоеточие, 30+ символов base64url в СМЕШАННОМ регистре
# (у живых токенов после двоеточия всегда `AA`).
#
# Слева от секрета НЕТ НИ ОДНОГО ограничения — ни `\b`, ни класса символов.
# Это прямое следствие G239: `\b` перед цифрами не срабатывает в `/bot<ТОКЕН>/`,
# потому что между `t` и цифрой границы слова нет. Любой левый якорь создаёт
# ровно один слепой контекст — и по закону подлости именно тот, в котором утечёт.
# Цена отказа: в строке из >12 цифр подряд правило поймает хвост числа. Это
# ошибка в сторону ЛОЖНОГО СРАБАТЫВАНИЯ — единственная, которую здесь можно себе
# позволить.
#
# `(?:bot)?` здесь КОСМЕТИКА, а не защита: без левого якоря матч и так начнётся
# с цифр. Литерал лишь втягивает `bot` в Match, чтобы в отчёте было видно
# URL-форму. НЕ считать его причиной, по которой ловится путь URL, и НЕ выводить
# из него keyword "bot" (см. keywords ниже).
#
# `keywords` нет намеренно — см. блок про keywords в правиле VK: у этой формы
# нет ни одного литерала, который присутствовал бы в КАЖДОМ матче.
[[rules]]
id = "setka-telegram-bot-token"
description = "Telegram Bot API token в любой форме, включая путь URL (инцидент 2026-08-12)"
regex = '''(?:bot)?[0-9]{6,12}:([A-Za-z0-9_-]{30,})'''
# Группа = только секретная половина. Нужна, чтобы entropy и allowlist ниже
# считались по секрету, а не по всему матчу (цифры id занижают энтропию и
# ломают якоря ^…$).
secretGroup = 1
# Пол по энтропии секретной половины. У настоящего 35-символьного base64url
# энтропия ≈ 4.7–4.9 (замер на синтетике той же формы: 4.84). Порог 3.5 — на
# целый бит ниже наблюдаемого минимума, промахнуться по живому токену он не
# может, зато срезает вырожденные хвосты (повторы, «TOKEN_FOR_LOCAL_DEV…»).
# Это ЕДИНСТВЕННАЯ строка правила, способная отсеять находку молча: если когда-
# нибудь возникнет сомнение — удалять надо именно её, а не регулярку.
entropy = 3.5
tags = ["telegram", "secret", "setka"]

  # Формы, которыми секрет Bot API быть НЕ МОЖЕТ ни при каких обстоятельствах.
  # Обе привязаны к ЦЕЛОМУ секрету (^…$ по secretGroup), поэтому не могут
  # «случайно» погасить настоящий токен, внутри которого встретился такой кусок.
  [[rules.allowlists]]
  description = "UUID и голый hex-дайджест после числового id — это не токен"
  regexes = [
    # `<число>:<UUID>` — реальная пара в трассировках/логах. UUID целиком состоит
    # из [0-9a-f-] и длиннее 30 символов, то есть иначе прошёл бы. Настоящий
    # 35-символьный секрет не может быть валидным UUID (36 символов, дефисы на
    # фиксированных позициях) — исключение безопасно.
    '''^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$''',
    # `<число>:<md5|sha1|sha256|…>` — пара «id: дайджест» в логах и отчётах.
    # Вероятность, что 35 символов настоящего токена все попадут в [0-9a-f],
    # равна (16/64)^35 ≈ 10^-21, и у живых токенов там гарантированно есть
    # заглавные. Исключаем ТОЛЬКО полностью строчный hex; общего правила «весь
    # секрет в нижнем регистре» здесь НЕТ — это и есть слепота дефолта.
    '''^[0-9a-f]+$''',
  ]

# ─── 2. VK access token нового формата ───────────────────────────────────────
#
# Якорь — литерал `vk1.a.` / `vk2.a.`, а не энтропия. `vk2.a.` добавлен на вырост:
# он уже встречается в потоках VK ID, а в репозитории про него не знает ничто.
#
# Нижняя граница тела 20 — не косметика: наши собственные маски печатают
# `token[:20]` (database/models.py) и `token[:12]` (web/api/token_management.py),
# то есть 14 и 6 символов тела. Порог 20 держит их НИЖЕ детекта — опустив его,
# получим правило, которое ругается на собственное маскирование. Верхней границы
# нет: длина тела не фиксирована ничем (колонка TEXT, pydantic min_length=10).
#
# entropy здесь НЕ задана осознанно: якорь литеральный и уникальный, отсеивать
# нечего, а любой энтропийный порог — это шанс молча пропустить находку.
[[rules]]
id = "setka-vk-access-token"
description = "VK access token формата vk1.a.* / vk2.a.* (инцидент 2026-08-19)"
regex = '''vk[12]\.a\.[A-Za-z0-9_-]{20,}'''
# ⚠️ ИНВАРИАНТ: keyword обязан быть подстрокой КАЖДОГО матча этой регулярки.
# keywords — это префильтр по фрагменту (ханк диффа с -U0 или чанк 10 КБ);
# если keyword не попал в тот же фрагмент, что и секрет, правило не запускается
# вообще и молча ничего не находит. Здесь оба keyword входят в сам матч по
# построению (сравнение — регистронезависимая подстрока), поэтому ложных
# пропусков дать не могут, а лишние фрагменты отсекают бесплатно.
# ПРАВИШЬ regex — ПРАВЬ И ЭТУ СТРОКУ. Появится `vk3.` в регулярке без keyword —
# правило ослепнет на него целиком и без единого предупреждения.
keywords = ["vk1.a.", "vk2.a."]
tags = ["vk", "secret", "setka"]

# ─── 3. VK access token легаси-формата (85 hex) ──────────────────────────────
#
# Форма до перехода VK на VK ID: 85 hex-символов, без префикса. До D-036 её не
# ловил ни gitleaks (правила под VK в дефолте нет вовсе), ни маскирование логов
# (utils/log_redaction.py знал только `vk1.a.`), ни клиентские проверки. Такой
# токен всё ещё принимается и БД (TEXT), и pydantic (min_length=10).
#
# Литерального якоря у формы нет, поэтому дискриминатор — сама длина: 85 нечётно,
# то есть это заведомо не hex-представление дайджеста (32/40/64/96/128).
# Границы — ЕДИНСТВЕННОЕ место, где стоит ограничение слева от секрета, и только
# потому, что без него правило матчилось бы ВНУТРИ каждого sha512 и его бы
# просто отключили (отключённое правило хуже отсутствующего).
# `\n` исключён из обоих классов намеренно: иначе левая граница съедала бы
# перевод строки, и StartLine находки (а с ним и отпечаток в .gitleaksignore)
# указывал бы на предыдущую строку. `\r` в классах оставлен — иначе форма
# «токен в конце строки» терялась бы в файлах с CRLF.
#
# ⚠️ КОНТЕКСТНОГО ЯКОРЯ (`access_token=` и т.п.) здесь нет СОЗНАТЕЛЬНО, и это
# самая спорная строка конфига. Цена решения замерена в обе стороны:
#   * без якоря ловится ЛЮБАЯ строка ровно из 85 hex — принятое ложное
#     срабатывание, зафиксировано подсадным `neg-hex85-bare` (fp);
#   * с якорем молча терялся бы токен в psql-выводе, YAML и repr — зафиксировано
#     подсадным `vk-legacy-psql` (hit).
# Замер FP: 0 находок на 618 коммитах истории и 0 в рабочем дереве (2026-08-25).
# Лечить единичный FP — строкой в .gitleaksignore, а не сужением правила.
[[rules]]
id = "setka-vk-legacy-hex-token"
description = "VK access token легаси-формата: ровно 85 hex-символов"
regex = '''(?m)(?:^|[^0-9a-fA-F\n])([0-9a-fA-F]{85})(?:[^0-9a-fA-F\n]|$)'''
# Границы — служебные символы, в Secret они не нужны.
secretGroup = 1
# У 85 случайных hex-символов энтропия ≈ 3.95 (потолок log2(16) = 4.0; замер на
# синтетике — 3.87). Порог 3.0 срезает вырожденные заглушки (`deadbeef…`,
# `aaaa…`, `0000…`), до настоящего токена ему почти бит.
entropy = 3.0
tags = ["vk", "legacy", "secret", "setka"]

[allowlist]
description = "Синтетические значения в тестах и примерах конфигов"

paths = [
  # Тесты маскирования обязаны содержать строки ФОРМАТА секретов — иначе они
  # не проверяют ничего. Значения синтетические (см. комментарий в файле).
  '''tests/test_logging/test_log_redaction\.py''',
  '''tests/test_logging/test_secret_scanner_config\.py''',
  '''tests/test_monitoring/test_telegram_bot_guard\.py''',
  # Тест работы с SSH-ключом (scripts/ssh_prod_access.py) тоже обязан держать
  # ключ-образную фикстуру: проверяется нормализация CRLF и «значение секрета
  # не попадает в вывод». Маркер собирается в рантайме, литерала PEM в файле
  # нет — но allowlist остаётся: он покрывает историю коммита, который
  # заводил эту фикстуру (2026-11-02), и не даёт гейту краснеть на первом же
  # PR с таким тестом.
  '''tests[/\\]test_scripts[/\\]test_ssh_prod_access\.py''',
  # Приёмочный корпус подсадных: он ЦЕЛИКОМ состоит из синтетических секретов,
  # без исключения даёт 44 находки и валил бы каждый коммит. Класс символов
  # `[/\\]` вместо `/` — не украшение: в git-режиме (CI, pre-commit) путь
  # приходит с прямыми слэшами, а в `gitleaks dir` на Windows — с обратными,
  # и запись с одним лишь `/` там молча не срабатывает (замер 2026-08-25).
  # Приёмка от этого исключения не страдает: ранер сканирует ВРЕМЕННЫЕ копии
  # payload'ов, а они под этот путь не подпадают (tests/test_logging/
  # test_decoy_corpus.py::test_tmp_copies_are_not_allowlisted).
  '''tests[/\\]test_logging[/\\]decoys\.corpus''',
  # Шаблоны окружения: значения — плейсхолдеры вида CHANGE_ME.
  '''\.env\.example''',
  '''config/setka\.env\.example''',
]

regexes = [
  # Явные плейсхолдеры в любом файле.
  # NB: `regexes` матчатся по САМОМУ СЕКРЕТУ (regexTarget не задан → дефолт
  # `secret`), а не по строке: слово-плейсхолдер обязано быть ВНУТРИ значения.
  '''placeholder''',
  '''CHANGE_ME''',
  '''(?i)your[_-]?(token|key|secret)[_-]?here''',
]
